name: forecast

# Fetches live buoy, tide and model data, rebuilds the forecast, commits the
# result, and publishes the page.
#
# The data fetching lives here rather than in the browser because GitHub's
# runners have unrestricted outbound network access, and committing each run is
# what builds the forecast archive the drift and skill panels depend on.
#
# The build and the publish are deliberately SEPARATE jobs: if GitHub Pages is
# not set up yet, only the publish fails. The forecast still builds and commits,
# so the data keeps accumulating and nothing is lost.

on:
  schedule:
    # Every three hours. GitHub runs scheduled workflows on the repository's
    # DEFAULT branch only, whatever that branch happens to be called.
    - cron: '7 */3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'docs/index.html'
      - 'docs/app.js'
      - 'docs/styles.css'
      - '.github/workflows/forecast.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tp-surfcast
  cancel-in-progress: false

jobs:
  build:
    name: Build forecast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run model tests
        run: node --test test/*.test.js

      - name: Build forecast
        run: node src/build.js

      - name: Report which data sources answered
        if: always()
        run: |
          echo "::group::diagnostics.json"
          cat docs/data/diagnostics.json || echo "(no diagnostics written)"
          echo "::endgroup::"

      - name: Commit forecast data
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STAMP="$(date -u +'%Y-%m-%dT%H:%MZ')"
          git add docs/data
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "forecast: run ${STAMP} [skip ci]"

          # Two runs can finish seconds apart - a push-triggered build and the
          # three-hourly one - and then both try to push regenerated JSON. The
          # old retry loop ran `git pull --rebase`, hit an unmergeable conflict
          # in forecast.json, and left the tree mid-rebase, so every remaining
          # attempt failed on "unmerged files" and a perfectly good forecast was
          # thrown away.
          #
          # There is nothing to merge here: each run regenerates the whole
          # forecast from the live sources, so the newer one is simply better.
          # On a collision, keep this run's data, replay it on top of whatever
          # arrived, and push that. Files the other run added and this one did
          # not - its archive record - are left in place rather than deleted.
          #
          # The accumulating files (the satellite record, the shelf
          # calibration, the beach state) lose the other run's increment this
          # way. That is a scene or an observation, and the next run picks it
          # up again, which is the cheaper of the two mistakes.
          for i in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i lost a race, replaying this run's data on top"
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            MINE="$(mktemp -d)"
            cp -a docs/data/. "${MINE}/"
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp -a "${MINE}/." docs/data/
            git add docs/data
            if git diff --staged --quiet; then
              echo "The other run's data already matches this one. Nothing to push."
              exit 0
            fi
            git commit -m "forecast: run ${STAMP} [skip ci]"
            sleep $((2 ** i))
          done
          echo "::error::Could not push the forecast data after 4 attempts."
          exit 1

      - name: Package the site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs
          retention-days: 3

  publish:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Publishing is best-effort: it needs Pages turned on in repository
    # settings, which is a one-time manual step. Until then this job fails on
    # its own and the forecast build above is unaffected.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The build job just pushed the fresh data; take the updated tip.
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
